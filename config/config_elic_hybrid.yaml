# Single GPU training Usage
# python train.py config/config_elic_hybrid.yaml

# Multi GPU training Usage
# torchrun --nproc_per_node=4 train.py config/config_elic_hybrid.yaml

experiment_name: elic_hybrid_small_10dB

# Model
model: ELIC_Hybrid
model_params: {
  N: 192,
  M: 320,
  num_slices: 5,
  snrdB: 10, 
  num_symbols: 16384,
  small: True
}

# Loss
loss: mse
lmbda: 0.0018
# 0.08, 0.16

# Epoch
initial_epoch: 0
epochs: 1000

# Batch Size
train_batch_size: 8
valid_batch_size: 1
use_mini_dataset: False
valid_repetitions: 1

# Learning
seed: 100
learning_rate: 1.0e-4
aux_learning_rate: 1.0e-3
lr_milestone_epoch: []
clip_max_norm: 1.0

# Dataset
train_dataset: ImageNet Large 8000
train_dataset_root: /datasets/ImageNet/
valid_dataset: Kodak
valid_dataset_root: /datasets/Kodak/
log_dir: logs/
num_workers: 16
use_cache: False

# Checkpoint
save_model: True
checkpoint: ./logs/elic_hybrid_small_10dB/latest_ckpt_ep271.pth.tar

# GPU
gpu_ids: ['2'] # Multi: use all devices / Single: use any available devices
dist_backend: nccl # Only works for multi_gpu learning
