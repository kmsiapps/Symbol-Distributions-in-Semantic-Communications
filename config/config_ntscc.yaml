# python train_ntscc.py --config config/config_ntscc.yaml
# nohup python train_ntscc.py --config config/config_ntscc.yaml 1>logs/NTSCC_NAT_o72/nohup.out 2>&1 &

experiment_name: TEST

seed: 1030
gpu-ids: ["0", "1", "2", "3"]
wandb: False
test-only: False

epochs: 1000

#logging:
print-every: 50
test-every: 1
save-every: 50

# Batch Size
train-batch-size: 8
use_mini_dataset: True
valid-repetitions: 1

#dataset:
train-dataset: ImageNet Large 8000
train-dataset-root: /datasets/ImageNet/
valid-dataset: Kodak
valid-dataset-root: /datasets/Kodak/
log-dir: logs/
num-workers: 16
use-cache: False

#optimizer:
train-lambda: 0.72
clip-max-norm: 1.0

#trainer
#pretrained-ntc: 'path to ntc checkpoint'
pretrained: './logs/NTC_pretrain/ckbd2_lmbd_0.18.pth.tar'

#network:
model: NTSCC_plus
