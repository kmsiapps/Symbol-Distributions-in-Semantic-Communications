# python train_sem.py config/semElic/semelic_small_base_cifar.yaml

# experiment_name: DEBUG
experiment_name: fSemELIC_sm10dB_base_cifar

# Model
model: SemELIC
model_params: {
  N: 192,
  M: 320,
  small: True,
  snrdB: 10, 
  num_symbols: 512
}

# Loss
loss_type: mse
factorized: True
lmbda: 1.0e-4

# Epoch
initial_epoch: 0
epochs: 4100

# Batch Size
train_batch_size: 32
valid_repetitions: 1
use_mini_dataset: False

# Learning
seed: 100
learning_rate: 1.0e-4
lr_milestone_epoch: [4000]
clip_max_norm: 1.0

# Dataset
train_dataset: CIFAR10_train
train_dataset_root: /datasets/
valid_dataset: CIFAR10_test
valid_dataset_root: /datasets/
log_dir: logs/
num_workers: 12
use_cache: False

# Checkpoint
save_model: True
# checkpoint: ./logs/fSemELIC_sm10dB_base_fac/latest_ckpt_ep916.pth.tar

# GPU
gpu_ids: ['0', '1', '2', '3'] # Multi: use all devices / Single: use any available devices
dist_backend: nccl # Only works for multi_gpu learning
