# Single GPU training Usage
# python train_sem.py config/config_semelic.yaml

# Multi GPU training Usage
# torchrun --nproc_per_node=4 train_sem.py config/config_semelic.yaml


experiment_name: SemELIC_small_10dB

# Model
model: SemELIC
model_params: {
  N: 192,
  M: 320,
  small: True,
  snrdB: 10, 
  num_symbols: 16384
}

# Loss
loss_type: mse
lmbda: 1

# Epoch
initial_epoch: 100
epochs: 4100

# Batch Size
train_batch_size: 16
valid_repetitions: 1
use_mini_dataset: True

# Learning
seed: 100
learning_rate: 1.0e-4
lr_milestone_epoch: [4000]
clip_max_norm: 1.0

# Dataset
train_dataset: ImageNet Large 8000
train_dataset_root: /datasets/ImageNet/
valid_dataset: Kodak
valid_dataset_root: /datasets/Kodak/
log_dir: logs/
num_workers: 48
use_cache: False

# Checkpoint
save_model: True
# checkpoint: ./logs/SemELIC_small_10dB/weights/Epoch_99.pth.tar

# GPU
gpu_ids: ['0', '1', '2', '3'] # Multi: use all devices / Single: use any available devices
dist_backend: nccl # Only works for multi_gpu learning
